<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>即時塗鴉挑戰｜內建範本辨識版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
    *{box-sizing:border-box}
    body{
      font-family:'Noto Sans TC',sans-serif;
      background:#ffc800;
      touch-action:none;
    }
    .canvas-container{box-shadow:8px 8px 0 rgba(0,0,0,.14)}
    #drawing-canvas{
      cursor:crosshair;
      background:#fff;
      width:100%;
      height:100%;
      display:block;
      touch-action:none;
    }
    .btn-shadow{
      box-shadow:4px 4px 0 rgba(0,0,0,.25);
      transition:.1s;
      border:2px solid #111;
      font-weight:900;
    }
    .btn-shadow:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.25)}
    .mini-card{box-shadow:4px 4px 0 rgba(0,0,0,.12)}
    .hidden{display:none!important}
  </style>
</head>
<body class="min-h-[100dvh] p-4 overflow-hidden flex flex-col items-center justify-center">

  <section id="menu-screen" class="text-center w-full max-w-4xl">
    <h1 class="text-5xl sm:text-7xl font-black mb-3 text-black">即時塗鴉挑戰</h1>
    <p class="text-xl sm:text-2xl mb-3 text-black/75 font-bold">內建範本辨識版｜不用 AI、不用 API Key、可離線遊玩</p>
    <p class="text-base sm:text-lg mb-8 text-black/65">系統會把你的塗鴉與內建簡筆素描範本比對，計算相似度分數。</p>
    <div id="category-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-4 max-w-3xl mx-auto"></div>
    <div class="mt-8 bg-white/80 border-4 border-black rounded-2xl p-4 text-left max-w-3xl mx-auto">
      <h2 class="font-black text-xl mb-2">玩法說明</h2>
      <p class="leading-relaxed">每局 6 回合。看到題目後，請在 20 秒內畫出簡筆圖。完成後，系統會將你的作品標準化成黑白線稿，和該題目的內建參考素描比對，並顯示「你的畫」與「參考素描」對照。</p>
    </div>
  </section>

  <section id="prompt-screen" class="hidden text-center">
    <div class="bg-white inline-block px-5 py-2 rounded-full border-4 border-black font-black text-xl mb-4">第 <span id="prompt-round">1</span> / 6 回合</div>
    <p class="text-3xl mb-2 text-black/70 font-bold">【<span id="prompt-category"></span>】請畫出</p>
    <h2 id="target-word" class="text-6xl sm:text-8xl font-black mb-5 text-black">...</h2>
    <div id="target-hints" class="mb-8 flex flex-wrap gap-2 justify-center"></div>
    <button id="begin-draw-btn" class="bg-black text-white text-3xl px-12 py-4 rounded-full btn-shadow">開始畫！</button>
  </section>

  <section id="game-screen" class="hidden w-full h-[100dvh] max-h-[820px] max-w-3xl flex flex-col items-center py-2">
    <div class="w-full flex justify-between items-center mb-3 px-1 shrink-0">
      <div class="text-xl sm:text-2xl font-black">目標：<span id="current-target" class="underline">...</span></div>
      <div id="timer" class="text-2xl sm:text-3xl font-black bg-white px-4 py-1 rounded-full border-4 border-black">20s</div>
    </div>
    <div class="canvas-container relative bg-white rounded-xl border-4 border-black overflow-hidden w-full flex-1 min-h-0">
      <canvas id="drawing-canvas"></canvas>
    </div>
    <div class="flex gap-4 mt-4 w-full shrink-0">
      <button id="clear-btn" class="flex-1 bg-red-400 hover:bg-red-500 text-white text-xl py-3 rounded-xl btn-shadow">清除畫布</button>
      <button id="submit-btn" class="flex-1 bg-green-500 hover:bg-green-600 text-white text-xl py-3 rounded-xl btn-shadow">我畫好了！</button>
    </div>
  </section>

  <section id="result-screen" class="hidden text-center w-full max-w-4xl">
    <h2 id="result-title" class="text-5xl sm:text-6xl font-black mb-4">比對完成！</h2>
    <div id="score-display" class="text-3xl sm:text-4xl font-black text-blue-600 mb-2 bg-white inline-block px-6 py-2 rounded-full border-4 border-black">相似度：0 / 100</div>
    <p id="score-breakdown" class="text-lg sm:text-xl font-black text-black/65 mb-4">輪廓：0｜覆蓋：0｜速度：0</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
      <div class="bg-white p-4 rounded-xl border-4 border-black mini-card">
        <h3 class="text-2xl font-black mb-2">你的畫</h3>
        <img id="final-sketch" class="max-h-64 mx-auto border-2 border-gray-100 bg-white rounded-lg" />
      </div>
      <div class="bg-white p-4 rounded-xl border-4 border-black mini-card">
        <h3 class="text-2xl font-black mb-2">參考素描</h3>
        <img id="template-sketch" class="max-h-64 mx-auto border-2 border-gray-100 bg-white rounded-lg" />
      </div>
    </div>
    <p id="result-detail" class="text-xl sm:text-2xl mb-6 text-black/75 font-bold">系統正在比對...</p>
    <button id="play-again-btn" class="bg-blue-500 hover:bg-blue-600 text-white text-2xl sm:text-3xl px-12 py-4 rounded-full btn-shadow">下一回合</button>
  </section>

  <section id="final-screen" class="hidden text-center w-full h-[100dvh] max-w-5xl mx-auto flex flex-col items-center overflow-y-auto pb-10 px-2">
    <h2 class="text-5xl sm:text-6xl font-black mb-4 mt-6 shrink-0">遊戲結束！</h2>
    <p class="text-2xl sm:text-3xl mb-5 shrink-0 font-bold">六回合總結</p>
    <div class="text-4xl sm:text-5xl font-black text-blue-600 mb-7 bg-white inline-block px-8 py-4 rounded-full border-4 border-black shrink-0">總分：<span id="final-total-score">0</span> / 600</div>
    <div id="history-gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 w-full mb-8 shrink-0"></div>
    <div id="advice-display" class="bg-white p-6 rounded-xl border-4 border-black text-left text-lg sm:text-xl text-black/80 leading-relaxed mb-8 w-full"></div>
    <button id="restart-game-btn" class="bg-green-500 hover:bg-green-600 text-white text-3xl px-12 py-4 rounded-full btn-shadow shrink-0 mb-8">回主選單</button>
  </section>

<script>
const categoriesData = {
  "動物": ["貓","狗","魚","鳥","蝴蝶","兔子","大象","烏龜","蛇","企鵝","螃蟹","長頸鹿"],
  "植物": ["樹","花","仙人掌","蘑菇","葉子","竹子","向日葵","荷花","蘋果樹","玫瑰","幸運草","紅蘿蔔"],
  "物品": ["房子","披薩","電腦","汽車","腳踏車","書","帽子","咖啡杯","火箭","雨傘","吉他","時鐘"],
  "節日": ["聖誕樹","燈籠","月餅","龍舟","紅包","南瓜燈","禮物","蛋糕","煙火","聖誕老人","愛心氣球","幽靈"],
  "動作": ["跑步","游泳","跳舞","睡覺","唱歌","看書","投籃","煮飯","揮手","微笑","爬山","拍照"],
  "人物": ["小丑","忍者","公主","國王","超人","嬰兒","老人","外星人","機器人","美人魚","巫師","海盜"],
  "職業": ["警察","醫生","老師","廚師","太空人","消防員","農夫","法官","歌手","畫家","司機","攝影師"],
  "成語": ["畫蛇添足","守株待兔","井底之蛙","對牛彈琴","盲人摸象","鶴立雞群","畫龍點睛","一箭雙鵰","雪中送炭","火上澆油","人山人海","大海撈針"]
};

const templateInfo = {
  "貓": ["三角耳朵","圓臉","鬍鬚","尾巴"], "狗":["垂耳","圓臉","身體","尾巴"], "魚":["橢圓身體","三角尾巴","眼睛","魚鰭"],
  "鳥":["身體","翅膀","鳥嘴","腳"], "蝴蝶":["左右翅膀","身體","觸角"], "兔子":["長耳朵","圓臉","小尾巴"],
  "大象":["大耳朵","長鼻子","身體"], "烏龜":["龜殼","頭","四肢"], "蛇":["彎曲長線","頭","舌頭"], "企鵝":["橢圓身體","白肚子","小翅膀"], "螃蟹":["圓身","鉗子","多隻腳"], "長頸鹿":["長脖子","斑點","四腳"],
  "樹":["樹冠","樹幹"], "花":["花瓣","花心","莖"], "仙人掌":["主幹","左右手臂","刺"], "蘑菇":["菇傘","菇柄"], "葉子":["葉形","葉脈"],
  "竹子":["竹節","葉片"], "向日葵":["大花瓣","圓花心","莖"], "荷花":["花瓣","水面","葉"], "蘋果樹":["樹冠","樹幹","蘋果"], "玫瑰":["螺旋花","莖","刺"], "幸運草":["四片葉"], "紅蘿蔔":["錐形身體","葉子"],
  "房子":["三角屋頂","方形牆","門窗"], "披薩":["三角形","起司","配料"], "電腦":["螢幕","底座","鍵盤"], "汽車":["車身","輪子"], "腳踏車":["兩輪","車架","把手"], "書":["封面","書頁"], "帽子":["帽頂","帽沿"], "咖啡杯":["杯身","把手","熱氣"], "火箭":["尖頭","尾焰"], "雨傘":["傘面","傘柄"], "吉他":["琴身","琴頸"], "時鐘":["圓形","指針"],
  "聖誕樹":["三層樹","星星"], "燈籠":["圓燈身","流蘇"], "月餅":["圓形","花紋"], "龍舟":["船身","龍頭"], "紅包":["長方形","封口"], "南瓜燈":["南瓜","眼睛","嘴"], "禮物":["盒子","緞帶"], "蛋糕":["蛋糕層","蠟燭"], "煙火":["放射線"], "聖誕老人":["帽子","鬍子"], "愛心氣球":["愛心","線"], "幽靈":["飄動外形","眼睛"],
  "跑步":["人形","跨步"], "游泳":["人形","水波"], "跳舞":["人形","動作線"], "睡覺":["床","Z字"], "唱歌":["人臉","音符"], "看書":["人形","書"], "投籃":["人形","球框"], "煮飯":["鍋子","熱氣"], "揮手":["人形","手臂"], "微笑":["臉","笑嘴"], "爬山":["人形","山"], "拍照":["人形","相機"],
  "小丑":["圓鼻","帽子","笑臉"], "忍者":["蒙面","頭巾"], "公主":["皇冠","裙子"], "國王":["皇冠","披風"], "超人":["披風","胸章"], "嬰兒":["圓臉","奶嘴"], "老人":["拐杖","眼鏡"], "外星人":["大眼睛","觸角"], "機器人":["方頭","身體"], "美人魚":["人身","魚尾"], "巫師":["尖帽","法杖"], "海盜":["眼罩","帽子"],
  "警察":["帽子","徽章"], "醫生":["聽診器","十字"], "老師":["黑板","教鞭"], "廚師":["高帽","鍋鏟"], "太空人":["頭盔","背包"], "消防員":["安全帽","水管"], "農夫":["草帽","鋤頭"], "法官":["槌子","法袍"], "歌手":["麥克風"], "畫家":["畫筆","畫板"], "司機":["方向盤"], "攝影師":["相機"],
  "畫蛇添足":["蛇","多餘的腳"], "守株待兔":["樹樁","兔子"], "井底之蛙":["井","青蛙"], "對牛彈琴":["牛","琴"], "盲人摸象":["人","大象"], "鶴立雞群":["高鳥","小雞群"], "畫龍點睛":["龍","眼睛"], "一箭雙鵰":["箭","兩隻鳥"], "雪中送炭":["雪","炭火"], "火上澆油":["火","油壺"], "人山人海":["許多人","山形"], "大海撈針":["海浪","針"]
};

let currentCategory="", currentTarget="", currentRound=1, totalScore=0, timeLeft=20, timerInterval=null;
let availablePrompts=[], gameHistory=[], isDrawing=false, lastX=0, lastY=0, strokeCount=0;
let promptCountdownInterval=null, promptAutoAdvanceTimer=null, countdownInterval=null, autoAdvanceTimer=null;
const maxRounds=6;
const screens={menu:qs('menu-screen'), prompt:qs('prompt-screen'), game:qs('game-screen'), result:qs('result-screen'), final:qs('final-screen')};
const canvas=qs('drawing-canvas'), ctx=canvas.getContext('2d');

function qs(id){return document.getElementById(id)}
function switchScreen(key){Object.values(screens).forEach(s=>s.classList.add('hidden'));screens[key].classList.remove('hidden')}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}

function init(){
  const colors=["bg-yellow-500","bg-green-500","bg-blue-500","bg-red-500","bg-purple-500","bg-orange-500","bg-teal-500","bg-pink-500"];
  qs('category-grid').innerHTML=Object.keys(categoriesData).map((cat,i)=>`<button class="category-btn ${colors[i%colors.length]} hover:brightness-95 text-white text-2xl px-6 py-4 rounded-full btn-shadow" data-category="${cat}">${cat}</button>`).join('');
  document.querySelectorAll('.category-btn').forEach(btn=>btn.addEventListener('click',startGameSession));
  qs('begin-draw-btn').addEventListener('click',startGame);
  qs('clear-btn').addEventListener('click',clearCanvas);
  qs('submit-btn').addEventListener('click',finishRound);
  qs('play-again-btn').addEventListener('click',nextRoundLogic);
  qs('restart-game-btn').addEventListener('click',()=>switchScreen('menu'));
  setupCanvas(); window.addEventListener('resize',setupCanvas);

  canvas.addEventListener('mousedown',startDrawing);
  canvas.addEventListener('mousemove',draw);
  canvas.addEventListener('mouseup',stopDrawing);
  canvas.addEventListener('mouseout',stopDrawing);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();const p=getTouch(e);startDrawing(p)}, {passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();const p=getTouch(e);draw(p)}, {passive:false});
  canvas.addEventListener('touchend',stopDrawing);
}

function getTouch(e){const t=e.touches[0],r=canvas.getBoundingClientRect();return {offsetX:t.clientX-r.left, offsetY:t.clientY-r.top}}
function setupCanvas(){
  const box=canvas.parentElement; if(!box || box.clientWidth===0)return;
  const old=canvas.toDataURL ? canvas.toDataURL() : null;
  canvas.width=box.clientWidth; canvas.height=box.clientHeight;
  ctx.lineJoin='round'; ctx.lineCap='round'; ctx.lineWidth=7; ctx.strokeStyle='#000';
  clearCanvas();
}
function clearCanvas(){ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);strokeCount=0}
function startDrawing(e){isDrawing=true;lastX=e.offsetX;lastY=e.offsetY;strokeCount++}
function draw(e){if(!isDrawing)return;ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();lastX=e.offsetX;lastY=e.offsetY}
function stopDrawing(){isDrawing=false}

function startGameSession(e){
  currentCategory=e.target.dataset.category;
  availablePrompts=[...categoriesData[currentCategory]];
  currentRound=1; totalScore=0; gameHistory=[];
  showPrompt();
}
function showPrompt(){
  currentTarget=rand(availablePrompts);
  availablePrompts=availablePrompts.filter(x=>x!==currentTarget);
  qs('prompt-category').innerText=currentCategory;
  qs('target-word').innerText=currentTarget;
  qs('prompt-round').innerText=currentRound;
  const hints=templateInfo[currentTarget]||["抓主要外形","簡單線條"];
  qs('target-hints').innerHTML=hints.map(h=>`<span class="bg-white border-2 border-black rounded-full px-3 py-1 font-bold">${h}</span>`).join('');
  let p=3; const btn=qs('begin-draw-btn'); btn.innerText=`開始畫！(${p}s)`;
  clearInterval(promptCountdownInterval); clearTimeout(promptAutoAdvanceTimer);
  promptCountdownInterval=setInterval(()=>{p--; if(p>0)btn.innerText=`開始畫！(${p}s)`},1000);
  promptAutoAdvanceTimer=setTimeout(startGame,3000);
  switchScreen('prompt');
}
function startGame(){
  clearInterval(promptCountdownInterval); clearTimeout(promptAutoAdvanceTimer); clearInterval(timerInterval);
  qs('current-target').innerText=currentTarget; timeLeft=20; clearCanvas();
  qs('timer').innerText=timeLeft+'s'; switchScreen('game'); setupCanvas();
  timerInterval=setInterval(()=>{timeLeft--; qs('timer').innerText=timeLeft+'s'; if(timeLeft<=0)finishRound()},1000);
}
function finishRound(){
  clearInterval(timerInterval);
  const timeRemaining=Math.max(0,timeLeft);
  if(strokeCount===0){handleResult({isCorrect:false,score:0,detail:"畫布是空白的，無法比對。",metrics:{shape:0,coverage:0,density:0},template:templateDataURL(currentTarget)},0);return}
  const result=evaluateByTemplate(currentTarget,timeRemaining);
  handleResult(result,timeRemaining);
}
function nextRoundLogic(){
  clearTimeout(autoAdvanceTimer); clearInterval(countdownInterval);
  if(currentRound<maxRounds){currentRound++; showPrompt()} else showFinalScreen();
}

function handleResult(result,timeRemaining){
  const score=Math.max(0,Math.min(100,result.score));
  totalScore=parseFloat((totalScore+score).toFixed(2));
  const playerImg=canvas.toDataURL('image/png');
  gameHistory.push({target:currentTarget,score,isCorrect:result.isCorrect,image:playerImg,template:result.template,detail:result.detail});
  qs('final-sketch').src=playerImg;
  qs('template-sketch').src=result.template;
  qs('score-display').innerText=`相似度：${score.toFixed(2)} / 100`;
  qs('score-breakdown').innerText=`輪廓吻合：${result.metrics.shape.toFixed(1)}｜覆蓋完整：${result.metrics.coverage.toFixed(1)}｜線條密度：${result.metrics.density.toFixed(1)}｜速度：${result.metrics.speed.toFixed(1)}`;
  qs('result-title').innerText=result.isCorrect?"成功辨識！":"差一點！";
  qs('result-title').className=result.isCorrect?"text-5xl sm:text-6xl font-black mb-4 text-green-600":"text-5xl sm:text-6xl font-black mb-4 text-red-500";
  qs('result-detail').innerText=result.detail;
  let c=4; const btn=qs('play-again-btn');
  const update=()=>btn.innerText=currentRound<maxRounds?`下一回合 (${c}s)`:`查看總成績 (${c}s)`;
  update(); clearInterval(countdownInterval); clearTimeout(autoAdvanceTimer);
  countdownInterval=setInterval(()=>{c--; if(c>0)update()},1000);
  autoAdvanceTimer=setTimeout(nextRoundLogic,4000);
  switchScreen('result');
}
function showFinalScreen(){
  qs('final-total-score').innerText=totalScore.toFixed(2);
  qs('history-gallery').innerHTML=gameHistory.map((it,i)=>`
    <div class="bg-white p-3 rounded-xl border-4 border-black mini-card">
      <div class="font-black text-xl mb-2">${i+1}. ${it.target}</div>
      <div class="grid grid-cols-2 gap-2">
        <div><div class="font-bold text-sm mb-1">你的畫</div><img src="${it.image}" class="w-full aspect-square object-contain border rounded bg-white"></div>
        <div><div class="font-bold text-sm mb-1">參考</div><img src="${it.template}" class="w-full aspect-square object-contain border rounded bg-white"></div>
      </div>
      <div class="${it.isCorrect?'text-green-600':'text-red-500'} font-black text-2xl mt-2">${it.score.toFixed(2)} 分</div>
    </div>`).join('');
  qs('advice-display').innerHTML=makeLocalAdvice();
  switchScreen('final');
}
function makeLocalAdvice(){
  const low=gameHistory.filter(x=>x.score<60).map(x=>x.target);
  const avg=gameHistory.reduce((s,x)=>s+x.score,0)/Math.max(1,gameHistory.length);
  let msg=`<h3 class="text-3xl font-black mb-3 text-purple-600">🎨 本機塗鴉小老師建議</h3>`;
  msg+=`<p>這次平均分數約 <b>${avg.toFixed(1)}</b> 分。這個版本不是 AI，而是把你的線稿和內建簡筆範本比對，所以最重要的是：<b>畫大一點、畫在中央、抓住關鍵特徵</b>。</p>`;
  if(low.length) msg+=`<p class="mt-3">分數較低的題目：<b>${low.join("、")}</b>。建議下一次先畫外框，再補上最有辨識度的細節，例如耳朵、尾巴、輪子、屋頂、指針或翅膀。</p>`;
  msg+=`<p class="mt-3">小技巧：20 秒內不要追求漂亮，先用圓形、三角形、長方形組成主體，再加 2～3 個特徵，比畫很多雜線更容易被系統判定相似喔！</p>`;
  return msg;
}

/* ===== 本機範本辨識核心 ===== */
function evaluateByTemplate(target,timeRemaining){
  const player=normalizedMaskFromCanvas(canvas);
  const tempCanvas=makeTemplateCanvas(target,128);
  const templ=normalizedMaskFromCanvas(tempCanvas);
  if(player.count<25){
    return {isCorrect:false, score:0, detail:"線條太少，請至少畫出主要外形。", metrics:{shape:0,coverage:0,density:0,speed:0}, template:tempCanvas.toDataURL()};
  }
  const pd=dilate(player.mask,128,2), td=dilate(templ.mask,128,3);
  let playerHit=0, templHit=0;
  for(let i=0;i<player.mask.length;i++){
    if(player.mask[i] && td[i]) playerHit++;
    if(templ.mask[i] && pd[i]) templHit++;
  }
  const precision=playerHit/Math.max(1,player.count);
  const recall=templHit/Math.max(1,templ.count);
